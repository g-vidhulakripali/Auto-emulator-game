# Frog's Kitchen bot settings. Positions are fractions of the screen (0..1).

adb_path: E:/LDPlayer/LDPlayer9/adb.exe
serials: ["emulator-5554", "127.0.0.1:5555"]

loop_interval: 0.3      # seconds between cycles
tap_delay: 0.05
buy_delay: 0.25
buy_burst: 3            # presses of a buy button per screenshot check (faster levelling)
# Safety (built in): only green buttons with a gold COIN icon are ever pressed, the
# Back key is never used, a 'Quit Game' dialog is always closed with its X, and any
# tap near a red/orange '!' badge or inside no_tap_regions is refused.

tasks:
  # order = priority within each cycle (your list):
  #   1 green arrow (Manage Eatery)  2 NEW + frog egg  3 red arrows  4 orange (evaluated)
  free_banner:          # (replaced by the background FREE-banner watcher in bot.py, which
    enabled: false      #  checks ~3x/second with a 'FREE' word template + OCR backup)
    every_seconds: 1
    gold_min: 0.28
  manage_eatery:        # 1: green up-arrow button bottom-right (the one allowed '!') ->
    enabled: true       # eatery multipliers (x10 price, faster cooking, +workers)
    every_seconds: 3          # how often to check the button for its red '!'
    only_when_badged: true
    badge_region: [0.78, 0.91, 0.85, 0.96]
    button_pos: [0.88, 0.96]
    popup_wait: 0.8
    max_buys: 15
  tap_egg:              # 2: white/teal frog egg wandering around -> tap to burst it
    enabled: true
    every_seconds: 1
    dir: templates/egg
    threshold: 0.75
  unlock_new:           # 2: NEW sticker -> one tap unlocks the item (template templates/new)
    enabled: true
    every_seconds: 1
    threshold: 0.75
    max_per_cycle: 2
    max_clicks: 3
    popup_wait: 0.8
  planner:              # 3+4: WHOLE-RESTAURANT plan. Scans top->bottom recording every red and
    enabled: true       # orange arrow (+ OCR payback). Any red anywhere -> best red (shortest
    every_seconds: 1    # payback); no red at all -> best orange. Scrolls there, buys, repeats.
    rescan_seconds: 90
    max_views: 8
    quick_tasks: [free_banner, manage_eatery, tap_egg, unlock_new, collect_coins]  # every view
    tap_offset: [1.2, 1.3]
    popup_wait: 0.5
    max_clicks: 45
    burst: 3
    min_payback: 1.0
  smart_upgrade:        # (older per-screen version of the strategy; planner replaces it)
    enabled: false
    max_red_per_cycle: 4
    red_sweep_seconds: 25   # no red seen for one scroll sweep -> oranges allowed
    every_seconds: 1
    min_y: 0.12
    tap_offset: [1.2, 1.3]
    popup_wait: 0.5
    max_survey: 6       # items peeked per view
    max_buy_items: 3    # items bought per view, best first
    max_clicks: 45
    burst: 3
    save_factor: 2.0    # better item elsewhere (2x faster payback) -> keep coins for it
    memory_seconds: 120 # how long surveyed paybacks from other views are remembered
    save_max_seconds: 60 # never save coins for one item longer than this
    min_payback: 1.0    # shorter = OCR misread, ignored
  upgrade_items:        # simple mode (old): upgrade every badge in view. Off: smart_upgrade
    enabled: false      # replaces it.
    every_seconds: 2
    max_per_cycle: 4
    max_clicks_per_item: 12
    popup_wait: 0.5
    tap_offset: [1.2, 1.3]   # item centre relative to badge (in badge sizes)
  collect_coins:        # big gold coins on the dining tables -> tap for extra money
    enabled: true
    every_seconds: 1
    max_taps: 10
  tap_templates:        # optional: drop cropped PNGs (e.g. order bubbles) into templates/tap
    enabled: false
    every_seconds: 1
    dir: templates/tap
    threshold: 0.85
  scroll:               # free panning (off: the planner does the scrolling)
    enabled: false
    every_seconds: 3    # time spent on each view before moving on
    step: 0.45          # drag length, fraction of screen height (top->bottom in ~3 views)
    x: 0.5
    y: 0.5

scroll:                 # drag tuning shared by restaurant + Manage Eatery list
  swipe_ms: 400         # slow drag = no fling
  settle: 0.45
  same_threshold: 6.0   # mean pixel diff below this = view did not move (end reached)

# Areas the bot must never act on: x1, y1, x2, y2
ignore_regions:
  - [0.00, 0.00, 0.31, 0.085]  # coin counter + income %
  - [0.31, 0.00, 0.61, 0.06]   # gems + buy-gems button
  - [0.78, 0.00, 1.00, 0.065]  # calendar + settings
  - [0.00, 0.085, 0.18, 0.28]  # left: starter pack, ad TV, gem frog
  - [0.84, 0.085, 1.00, 0.27]  # right: event / pass icons
  - [0.00, 0.82, 0.21, 0.90]   # discount (%) button
  - [0.83, 0.85, 1.00, 0.93]   # rocket boost
  - [0.00, 0.89, 1.00, 1.00]   # bottom menu bar

# The ONLY '!'-carrying button the bot may press: Manage Eatery (x, y, radius).
allow_tap_points:
  - [0.88, 0.96, 0.04]

# Hard tap block: every HUD button EXCEPT the Manage Eatery button (bottom right).
no_tap_regions:
  - [0.00, 0.00, 0.31, 0.085]  # coin counter + income %
  - [0.31, 0.00, 0.61, 0.06]   # gems + buy-gems button
  - [0.78, 0.00, 1.00, 0.065]  # calendar + settings
  - [0.00, 0.085, 0.18, 0.28]  # starter pack, ad TV, gem frog
  - [0.84, 0.085, 1.00, 0.27]  # event / pass icons
  - [0.00, 0.82, 0.21, 0.90]   # discount (%) button
  - [0.83, 0.85, 1.00, 0.93]   # rocket boost
  - [0.00, 0.89, 0.79, 1.00]   # bottom menu: camera, shop, x2 ad boost, outfits
